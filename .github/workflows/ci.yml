name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 中文输出的编码通路：本机 -X utf8 只管我们自己敲的命令，CI 的步骤不含它。
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show interpreter
        run: python -c "import sys; print(sys.version)"

      - name: Layout gate (methodology binding)
        run: python tools/check-sprint-layout.py

      - name: Layout gate mutation verification (every mutation must go red)
        run: python tools/mutate-layout-gate.py

      - name: Install (editable, dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: CLI smoke (every subcommand help must exit 0)
        shell: bash
        run: |
          set -euo pipefail
          python -m crsscope --version
          python -m crsscope --help > /dev/null
          for sub in decl detect xdiff geojson tiles report; do
            python -m crsscope "$sub" --help > /dev/null
          done
          echo "smoke ok"

      - name: Unimplemented commands must exit 3 (never 0)
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          # 只剩 report 未实现（M6）；geojson / tiles 已在 M5 落位，不能再拿它们当靶子。
          python -m crsscope report nonexistent.json || rc=$?
          if [ "$rc" -ne 3 ]; then
            echo "expected exit 3 for unimplemented command, got $rc"
            exit 1
          fi
          echo "contract ok (rc=$rc)"
