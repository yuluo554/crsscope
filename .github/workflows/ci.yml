name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 中文输出的编码通路：本机 -X utf8 只管我们自己敲的命令，CI 的步骤不含它。
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      # 2026-10-28 二次迭代：checkout v4→v7、setup-python v5→v7（最新 v7.0.1 / v7.1.0）。
      # 动机是每条 check-run 都带 `Node.js 20 is deprecated` 注解，且注解掩盖真问题。
      # 版本升降**本地门看不见**（布局门只断言 ci.yml 里有这两个步骤名，不判 uses 版本），
      # 所以升完必须真推一次看 CI 四组矩阵绿——见 plan/RELEASE-M7.md §二。
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show interpreter
        run: python -c "import sys; print(sys.version)"

      - name: Layout gate (methodology binding)
        run: python tools/check-sprint-layout.py

      - name: Layout gate mutation verification (every mutation must go red)
        run: python tools/mutate-layout-gate.py

      - name: Release gate (offline tier only; no git metadata, no network)
        run: python tools/check-release.py

      - name: Install (editable, dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: CLI smoke (every subcommand help must exit 0)
        shell: bash
        run: |
          set -euo pipefail
          python -m crsscope --version
          python -m crsscope --help > /dev/null
          for sub in decl detect xdiff geojson tiles report; do
            python -m crsscope "$sub" --help > /dev/null
          done
          echo "smoke ok"

      - name: Unknown subcommand must exit 2 (usage error, never 0)
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          # M6 起 report 已落位，"未实现命令 exit 3"的靶子不存在了；
          # 保留的是另一条硬契约：不存在的子命令必须走用法错误（exit 2），绝不许 0。
          python -m crsscope no-such-subcommand || rc=$?
          if [ "$rc" -ne 2 ]; then
            echo "expected exit 2 for unknown subcommand, got $rc"
            exit 1
          fi
          echo "contract ok (rc=$rc)"
